# Node CI for the token-issuance client: workflow lint, install, dependency checks, the template-artefact drift check, type-check, lint, tests, the declaration build and a check of what the
# tarball would contain, on Node 26; then the tests again on Node 24, the minimum the package declares (`engines`). It runs on every push to main and every pull request, and the release
# workflow (npm-publish.yml) calls it on the tagged commit so a tag that fails never publishes. The real-chain end to end is separate (localnet.yml, nightly, and a release gate), and so
# are the live testnet checks (live.yml, weekly).
name: Node CI

on:
  push:
    branches: ["main"]
  pull_request:
  # The release workflow runs the same checks on the tagged commit.
  workflow_call:

# Read-only: CI needs nothing but the checkout.
permissions:
  contents: read

# No tool may phone home from CI (the fleet's privacy rule; npm, Node and other tools honour it).
env:
  DO_NOT_TRACK: "1"

jobs:
  check:
    name: Type-check & test
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned by full commit SHA with the version in a comment (D12).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Node 26 is the fleet baseline (D56).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      # Lints the workflow files themselves (the image is pinned by digest).
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo docker.io/rhysd/actionlint:1.7.7@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9 -color

      # `npm ci` installs exactly the lockfile, so CI tests what was reviewed.
      - name: Install dependencies
        run: npm ci

      # Fails if a peer range is unsatisfied or the tree is inconsistent.
      - name: Dependency tree is valid (peer ranges satisfied)
        run: npm ls --all >/dev/null

      # High and critical advisories fail the build. This repository does not depend on @meddleware/frontend-config, so it does not use that package's gate
      # (which adds an expiring allow-list); the threshold is the same, and there is no allow-list to keep.
      - name: Audit dependencies
        run: npm audit --audit-level=high

      # src/template/ is generated from the pinned template package; this fails if the committed files differ from what it produces.
      - name: Template artefact matches @meddleware/token-issuance-template-sui
        run: npm run check:template

      # tsc over src/ and tests/ (the tests are included, so a type error in a test fails here).
      - name: Type-check
        run: npm run type-check

      # eslint with the TypeScript rule set (there are no Vue files in this package).
      - name: Lint JS (eslint)
        run: npm run lint:js

      # The offline unit tests (the real-chain end to end is nightly, in localnet.yml).
      - name: Test
        run: npm test

      # The published declarations; failing here means a type that cannot be declared.
      - name: Build declarations
        run: npm run build

      # What `npm publish` would ship, checked for the entry points (the declarations must exist, or consumers lose their types).
      - name: Package contents
        run: |
          npm pack --dry-run --json > pack.json
          node -e "
            const [p] = JSON.parse(require('fs').readFileSync('pack.json', 'utf8'))
            const files = p.files.map((f) => f.path)
            for (const f of ['package.json', 'dist/index.d.ts']) if (!files.includes(f)) { console.error('missing from the tarball:', f); process.exit(1) }
          "

  # The package declares `engines: node >=24`; this proves the claim by running the tests on that version.
  node24-compat:
    name: Node 24 compatibility (engines >=24)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The oldest supported Node, not the baseline.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Test on the minimum supported Node
        run: npm test
