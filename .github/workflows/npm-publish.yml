name: Publish (npm)

# Publishes the package to npmjs on a v* tag. Publication is gated on a
# `verify` job that runs the same workflow as CI (audit, template artefact, type-check, lint, tests,
# declarations) on the exact tagged commit, and on a `localnet-gate` job that refuses the tag while the
# localnet e2e (localnet.yml) is red, missing or stale, so a broken tag never ships.
# Authentication uses npm OIDC trusted publishing — no long-lived NPM_TOKEN. The release steps are in the workspace's
# PUBLISHING.md: tag, wait for this workflow, and re-run the failed job if Sigstore answers 500 or 409 (transient).

on:
  push:
    tags:
      - 'v*'

# Read-only by default; only the publish job is granted an OIDC token.
permissions:
  contents: read

# No tool may phone home from CI (the fleet's privacy rule).
env:
  DO_NOT_TRACK: "1"

jobs:
  # The whole CI workflow, on the tagged commit.
  verify:
    name: Verify (CI checks)
    uses: ./.github/workflows/node-ci.yml

  # The localnet e2e is the only test that publishes patched coins on a real chain (the bytecode verifier
  # is the judge). It is too heavy for the tag, so the gate reads the result of the nightly / dispatched
  # run instead: a red newest run on main, no run, or a green one older than 72 h blocks the release. To
  # release right after a fix, dispatch "Localnet e2e" on main (or on the commit you tag: a run for the
  # tagged commit is judged on its own) and wait for it to pass before pushing the tag.
  localnet-gate:
    name: Localnet e2e is not red
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      # `gh run list` as JSON on stdin; `.github/localnet-gate.mjs` reads it, and its exit code is the verdict (tested in tests/localnet-gate.test.ts).
      - name: Latest localnet run
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_SHA: ${{ github.sha }}
        run: |
          gh run list --repo "$GITHUB_REPOSITORY" --workflow localnet.yml --branch main \
            --status completed --limit 30 \
            --json conclusion,headSha,url,createdAt,event | node .github/localnet-gate.mjs

  publish-npm:
    name: npmjs (@meddleware/token-issuance-client)
    needs: [verify, localnet-gate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # required for OIDC trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          registry-url: 'https://registry.npmjs.org'
      # Trusted publishing (OIDC) requires npm >= 11.5.1. The npm bundled with Node changes with every Node release, so the
      # version is pinned (D12) and is the same in every repo's publish job.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11.20.0
      - name: Install dependencies
        run: npm ci
      # `prepublishOnly` would also build, but building here fails the job before the publish step if the declarations cannot be produced.
      - name: Build
        run: npm run build
      # A tag that names a different version than package.json would publish the wrong number under the tag's provenance.
      - name: Tag matches the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "::error::tag ${TAG} does not match package.json version ${VERSION}"
            exit 1
          fi

      - name: Publish to npmjs (OIDC, idempotent)
        run: |
          VERSION=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./package.json').name")
          # The registry URL encodes the scope's slash.
          ENC=$(printf '%s' "$NAME" | sed 's#/#%2f#')
          # Check the registry directly — `npm view` can transiently miss a freshly
          # first-published version and then attempt a re-publish. A 200 means it's live.
          if [ "$(curl -s -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/${ENC}/${VERSION}")" = "200" ]; then
            echo "::notice::v${VERSION} already published to npmjs — skipping."
          else
            # Publish, but treat a "version already exists" error as success so a
            # manually-published version (or a registry race) leaves the job green.
            # --provenance links the published version to this workflow run (Sigstore).
            set +e; OUT=$(npm publish --provenance --access public 2>&1); RC=$?; set -e
            printf '%s\n' "$OUT"
            if [ "$RC" -ne 0 ]; then
              if printf '%s' "$OUT" | grep -qiE 'cannot publish over|previously published|EPUBLISHCONFLICT'; then
                echo "::notice::v${VERSION} already published — treating as success."
              else
                exit "$RC"
              fi
            fi
          fi
