name: Live checks

# Read-only checks against public testnet (no secrets): the ABI of the framework calls the transactions use
# and the chain identifier handling. Weekly, because a framework change shows up here before it breaks a
# user. The localnet end-to-end (`npm run e2e:localnet`) is its own workflow, `localnet.yml`, and a release gate.

on:
  schedule:
    # Mondays at 05:27 UTC (an odd minute, so it does not queue with the fleet's other jobs on the hour).
    - cron: '27 5 * * 1'
  # And on demand, for a check after a framework change.
  workflow_dispatch:

# Read-only: the suite reads public testnet and needs no key or secret.
permissions:
  contents: read

# No tool may phone home from CI (the fleet's privacy rule).
env:
  DO_NOT_TRACK: "1"

jobs:
  live:
    name: Testnet read-only suite
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned by full commit SHA with the version in a comment (D12).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Node 26 is the fleet baseline (D56).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - run: npm ci
      # `npm run test:integration` sets GRPC_TESTNET=1 itself.
      - name: Live read-only suite
        run: npm run test:integration
